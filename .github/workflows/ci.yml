name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Start Docker Compose
      run: docker compose up -d --build

    - name: Wait for MySQL (robuste)
      run: |
        echo "Waiting for MySQL..."
        for i in {1..50}; do
          if docker compose exec -T db mysqladmin ping -h 127.0.0.1 -uroot --password=root_password --silent; then
            echo "MySQL is ready!"
            break
          fi
          echo "MySQL not ready yet..."
          sleep 5
        done

    - name: Install Composer inside container
      run: docker compose exec -T app composer install --no-interaction --prefer-dist

    - name: Run PHPUnit tests inside container
      run: docker compose exec -T app php ./vendor/bin/phpunit --testdox

    - name: Stop Docker Compose
      if: always()
      run: docker compose down -v
