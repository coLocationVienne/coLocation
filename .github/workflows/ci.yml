name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Start Docker Compose
      run: docker compose up -d --build

    - name: Wait for MySQL
      run: |
        echo "Waiting for MySQL..."
        for i in {1..30}; do
          if docker compose exec -T db mysqladmin ping -uroot -proot_password --silent; then
            echo "MySQL is ready"
            break
          fi
          sleep 2
        done

    - name: Install Composer inside container
      run: docker compose exec -T app composer install --no-interaction --prefer-dist

    - name: Run PHPUnit inside container
      run: docker compose exec -T app ./vendor/bin/phpunit --testdox

    - name: Stop Docker
      if: always()
      run: docker compose down -v
