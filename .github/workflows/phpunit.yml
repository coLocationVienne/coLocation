name: CI — Tests & Docker

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:

  tests-unitaires:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: colocation
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      mail:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist

      - name: Initialiser la base de données
        run: mysql -h 127.0.0.1 -uroot -proot_password colocation < SQL/colocation.sql

      - name: Lancer les tests unitaires
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_DATABASE: colocation
          MYSQL_USER: root
          MYSQL_PASSWORD: root_password
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: 1025
          SMTP_AUTH: "false"
          SMTP_SECURE: "none"
        run: ./vendor/bin/phpunit --exclude-group integration

  tests-integration:
    runs-on: ubuntu-latest
    needs: tests-unitaires

    steps:
      - uses: actions/checkout@v4

      - name: Démarrer Docker
        run: docker compose up -d --build

      - name: Attendre MySQL
        run: |
          echo "Attente de la santé de MySQL..."
          for i in {1..60}; do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' colocation_db)" == "healthy" ]; then
              echo "MySQL est sain !"
              break
            fi
            echo "Attente... ($i/60)"
            sleep 2
          done

      - name: Installer Composer dans le conteneur
        run: docker compose exec -T app composer install --no-interaction --prefer-dist

      - name: Lancer les tests d'intégration
        run: docker compose exec -T app ./vendor/bin/phpunit --testdox

      - name: Arrêter Docker
        if: always()
        run: docker compose down -v
