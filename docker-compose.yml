version: '3.8'

services:
  app:
    build: .
    container_name: colocation_app
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: colocation
      MYSQL_USER: root
      MYSQL_PASSWORD: root_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - colocation_network
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: colocation_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: colocation
      MYSQL_USER: root
      MYSQL_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql
      - ./SQL/colocation.sql:/docker-entrypoint-initdb.d/colocation.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 10s
      retries: 10
    ports:
      - "3306:3306"
    networks:
      - colocation_network
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: colocation_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root_password
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - colocation_network
    restart: unless-stopped

volumes:
  db_data:

networks:
  colocation_network:
    driver: bridge

