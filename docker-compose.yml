
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: colocation
      MYSQL_USER: root
      MYSQL_PASSWORD: root_password

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: colocation
    volumes:
      - db_data:/var/lib/mysql
      - ./SQL/colocation.sql:/docker-entrypoint-initdb.d/colocation.sql
    ports:
      - "3306:3306"

volumes:
  db_data:
