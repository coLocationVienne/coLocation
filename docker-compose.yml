
services:
  app:
    build: .
    container_name: colocation_app
    ports:
      - "80:80"
    # For standalone use, we don't strictly need the volume, 
    # but it's kept here for development convenience.
    volumes:
      - ./:/var/www/html
    environment:
      APP_BASE_URL: "/"
      MYSQL_HOST: db
      MYSQL_DATABASE: colocation
      MYSQL_USER: root
      MYSQL_PASSWORD: root_password
      SMTP_HOST: mail
      SMTP_PORT: 1025
      SMTP_AUTH: "false"
      SMTP_SECURE: "none"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - colocation_network
    restart: unless-stopped

  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: colocation_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: colocation
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - colocation_network
    restart: unless-stopped

  mail:
    image: axllent/mailpit:latest
    container_name: colocation_mail
    ports:
      - "8025:8025"
    networks:
      - colocation_network
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: colocation_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root_password
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - colocation_network
    restart: unless-stopped

volumes:
  db_data:

networks:
  colocation_network:
    driver: bridge
